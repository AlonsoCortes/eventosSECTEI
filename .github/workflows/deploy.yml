name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Evita despliegues simultáneos; cancela el en curso si llega uno nuevo
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inyectar credenciales Supabase en config.js
        env:
          SUPABASE_URL:  ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON: ${{ secrets.SUPABASE_ANON }}
        run: |
          sed -i \
            -e "s|https://TU-PROYECTO.supabase.co|${SUPABASE_URL}|g" \
            -e "s|TU-ANON-KEY|${SUPABASE_ANON}|g" \
            js/config.js

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: .   # raíz del repo = carpeta a publicar

      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
