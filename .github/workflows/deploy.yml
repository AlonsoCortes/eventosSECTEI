name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Evita despliegues simultáneos; cancela el en curso si llega uno nuevo
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generar config.js con credenciales Supabase
        env:
          SUPABASE_URL:  ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON: ${{ secrets.SUPABASE_ANON }}
        run: |
          cat > js/config.js << 'EOF'
          const SUPABASE_URL  = 'SUPABASE_URL_PLACEHOLDER';
          const SUPABASE_ANON = 'SUPABASE_ANON_PLACEHOLDER';
          const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
          EOF
          sed -i \
            -e "s|SUPABASE_URL_PLACEHOLDER|${SUPABASE_URL}|g" \
            -e "s|SUPABASE_ANON_PLACEHOLDER|${SUPABASE_ANON}|g" \
            js/config.js

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: .   # raíz del repo = carpeta a publicar

      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
