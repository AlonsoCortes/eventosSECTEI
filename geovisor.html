<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Geovisor – Eventos SECTEI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/sisdai.min.css">
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/geovisor.css">
  <!-- MapLibre GL CSS -->
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.css">
</head>
<body>

  <nav class="navbar">
    <div class="navbar__logos">
      <a href="index.html">
        <img src="assets/img/logos/Logo_CDMX.png" alt="Ciudad de México" class="navbar__logo">
      </a>
      <img src="assets/img/logos/Logo_Dependencia.png"
           alt="Secretaría de Educación, Ciencia, Tecnología e Innovación" class="navbar__logo">
    </div>
    <ul class="navbar__nav">
      <li><a href="geovisor.html" class="activo">Geovisor</a></li>
      <li><a href="dashboard.html">Dashboard</a></li>
      <li><a href="assets/form/index.html" class="btn-registrar">+ Registrar</a></li>
    </ul>
  </nav>

  <div class="layout-geovisor">

    <!-- Panel lateral de filtros y lista -->
    <aside class="panel-lateral">
      <div class="panel-lateral__encabezado">
        <h2>Filtros</h2>
        <div class="filtro-grupo">
          <label for="filtro-municipio">Alcaldía</label>
          <select id="filtro-municipio">
            <option value="">Todos</option>
          </select>
        </div>
        <div class="filtro-fechas">
          <div class="filtro-grupo">
            <label for="filtro-fecha-desde">Desde</label>
            <input type="date" id="filtro-fecha-desde">
          </div>
          <div class="filtro-grupo">
            <label for="filtro-fecha-hasta">Hasta</label>
            <input type="date" id="filtro-fecha-hasta">
          </div>
        </div>
        <button class="btn btn-secundario" id="btn-limpiar-filtros" style="width:100%;margin-top:.25rem;padding:.3rem .75rem;font-size:.8rem">
          Limpiar filtros
        </button>
      </div>

      <div class="panel-lateral__contenido">
        <p class="contador-eventos" id="contador-eventos"></p>
        <ul class="lista-eventos" id="lista-eventos">
          <li style="padding:.45rem .35rem;color:var(--color-texto-suave)">Cargando eventos…</li>
        </ul>
      </div>
    </aside>

    <!-- Mapa -->
    <div id="mapa"></div>
  </div>

  <!-- Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <!-- MapLibre GL JS -->
  <script src="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/geovisor.js"></script>
</body>
</html>
